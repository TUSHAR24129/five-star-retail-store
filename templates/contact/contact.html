{% extends 'base.html' %}
{% block title %}Contact | Retail Shop{% endblock %}

{% block content %}
<section class="page-hero">
<h1>📬 Contact Us</h1>
<p>We'd love to hear from you</p>
</section>

<div class="container py-5">
<div class="row justify-content-center">
<div class="col-md-7">
<div class="card shadow p-4">
<h3 class="mb-4" style="border-left:4px solid #2563eb;padding-left:14px;">
Send Us a Message
</h3>
<form method="post">
{% csrf_token %}
<div class="mb-3">
<label class="form-label fw-semibold">Name</label>
<input type="text" name="name" class="form-control"
       placeholder="Your full name" required>
</div>
<div class="mb-3">
<label class="form-label fw-semibold">Email</label>
<input type="email" name="email" class="form-control"
       placeholder="your@email.com" required>
</div>
<div class="mb-3">
<label class="form-label fw-semibold">Message</label>
<textarea name="message" class="form-control" rows="5"
          placeholder="How can we help?" required></textarea>
</div>
<button class="btn btn-primary btn-lg w-100">Send Message</button>
</div>
</div>
</div>
</div>
{% endblock %}
